apiVersion: apps/v1
kind: Deployment
metadata:
  name: pststore
  labels:
    app: pststore
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pststore
  template:
    metadata:
      labels:
        app: pststore
    spec:
      containers:
        - name: pststore
          image: docker.io/pavelstetina/publicstore:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
            - containerPort: 4443
